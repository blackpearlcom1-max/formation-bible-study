<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión — Formation Estudio Bíblico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #0f0620; }
    .brand-font { font-family: 'Playfair Display', serif; }
    .glass { background: rgba(255,255,255,0.06); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    .btn-primary { background: linear-gradient(135deg, #7c3aed, #6d28d9); transition: all 0.2s; }
    .btn-primary:hover { background: linear-gradient(135deg, #8b5cf6, #7c3aed); transform: translateY(-1px); }
    .input-field { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); color: #f3f0ff; transition: border 0.2s; }
    .input-field:focus { outline: none; border-color: #7c3aed; background: rgba(124,58,237,0.1); }
    .input-field::placeholder { color: rgba(255,255,255,0.35); }
    .divider { display: flex; align-items: center; gap: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
    .error-msg { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .tab-active { color: #a78bfa; border-bottom: 2px solid #7c3aed; }
    .tab-inactive { color: rgba(255,255,255,0.5); border-bottom: 2px solid transparent; }
    .tab-inactive:hover { color: rgba(255,255,255,0.8); }
    .hidden { display: none !important; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">

  <!-- Background glow -->
  <div class="fixed inset-0 pointer-events-none">
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-96 h-96 bg-purple-700 rounded-full blur-3xl opacity-20"></div>
  </div>

  <div class="w-full max-w-md relative z-10">

    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="../formation-website-es/index.html" class="inline-block">
        <span class="brand-font text-2xl font-bold text-white">Formation</span>
        <span class="text-amber-400 text-sm ml-1">Estudio Bíblico</span>
      </a>
      <p class="text-purple-300 text-sm mt-1">Estudia más profundo. Comprende más.</p>
    </div>

    <!-- Card -->
    <div class="glass rounded-2xl p-8">

      <!-- Tabs -->
      <div class="flex mb-6 border-b border-white/10">
        <button id="tab-signin" onclick="switchTab('signin')"
          class="tab-active flex-1 pb-3 text-sm font-semibold transition-all">Iniciar Sesión</button>
        <button id="tab-signup" onclick="switchTab('signup')"
          class="tab-inactive flex-1 pb-3 text-sm font-semibold transition-all">Crear Cuenta</button>
      </div>

      <!-- Error message -->
      <div id="error-msg" class="error-msg rounded-lg px-4 py-3 text-sm mb-4 hidden"></div>
      <!-- Success message -->
      <div id="success-msg" class="bg-green-900/30 border border-green-500/30 text-green-300 rounded-lg px-4 py-3 text-sm mb-4 hidden"></div>

      <!-- Google OAuth -->
      <button onclick="signInWithGoogle()" id="google-btn"
        class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-xl border border-white/15 bg-white/5 hover:bg-white/10 transition-all text-white text-sm font-medium mb-5">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continuar con Google
      </button>

      <div class="divider text-white/30 text-xs mb-5">o usa tu correo</div>

      <!-- Sign In Form -->
      <form id="form-signin" onsubmit="handleSignIn(event)" class="space-y-4">
        <div>
          <label class="text-white/70 text-xs font-medium mb-1.5 block">Correo electrónico</label>
          <input type="email" id="signin-email" placeholder="tucorreo@ejemplo.com" required
            class="input-field w-full rounded-xl px-4 py-3 text-sm" />
        </div>
        <div>
          <label class="text-white/70 text-xs font-medium mb-1.5 block">Contraseña</label>
          <input type="password" id="signin-password" placeholder="••••••••" required
            class="input-field w-full rounded-xl px-4 py-3 text-sm" />
          <button type="button" onclick="showForgotPassword()" class="text-purple-400 text-xs mt-1.5 hover:text-purple-300 transition-colors">¿Olvidaste tu contraseña?</button>
        </div>
        <button type="submit" id="signin-btn" class="btn-primary w-full py-3 rounded-xl text-white font-semibold text-sm mt-2">
          Iniciar Sesión
        </button>
      </form>

      <!-- Sign Up Form -->
      <form id="form-signup" onsubmit="handleSignUp(event)" class="space-y-4 hidden">
        <div>
          <label class="text-white/70 text-xs font-medium mb-1.5 block">Nombre completo</label>
          <input type="text" id="signup-name" placeholder="Tu nombre" required
            class="input-field w-full rounded-xl px-4 py-3 text-sm" />
        </div>
        <div>
          <label class="text-white/70 text-xs font-medium mb-1.5 block">Correo electrónico</label>
          <input type="email" id="signup-email" placeholder="tucorreo@ejemplo.com" required
            class="input-field w-full rounded-xl px-4 py-3 text-sm" />
        </div>
        <div>
          <label class="text-white/70 text-xs font-medium mb-1.5 block">Contraseña</label>
          <input type="password" id="signup-password" placeholder="Mínimo 8 caracteres" minlength="8" required
            class="input-field w-full rounded-xl px-4 py-3 text-sm" />
        </div>
        <button type="submit" id="signup-btn" class="btn-primary w-full py-3 rounded-xl text-white font-semibold text-sm mt-2">
          Crear Cuenta
        </button>
        <p class="text-white/40 text-xs text-center">
          Al crear una cuenta aceptas nuestros <a href="../formation-website-es/terms.html" class="text-purple-400 hover:underline">Términos</a> y <a href="../formation-website-es/privacy_policy.html" class="text-purple-400 hover:underline">Política de Privacidad</a>.
        </p>
      </form>

    </div><!-- /card -->

    <p class="text-center text-white/30 text-xs mt-6">
      &copy; 2026 Berean Defense LLC · Formation Estudio Bíblico
    </p>
  </div>

  <script>
    const SUPABASE_URL = 'https://tdlaxuquplqejvijqiow.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_XKst_txiZq9NFajFQe86hw_ygsXhJju';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    sb.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = 'app.html';
    });

    sb.auth.onAuthStateChange((event, session) => {
      if (session) window.location.href = 'app.html';
    });

    function switchTab(tab) {
      const isSignin = tab === 'signin';
      document.getElementById('form-signin').classList.toggle('hidden', !isSignin);
      document.getElementById('form-signup').classList.toggle('hidden', isSignin);
      document.getElementById('tab-signin').className = isSignin ? 'tab-active flex-1 pb-3 text-sm font-semibold transition-all' : 'tab-inactive flex-1 pb-3 text-sm font-semibold transition-all';
      document.getElementById('tab-signup').className = !isSignin ? 'tab-active flex-1 pb-3 text-sm font-semibold transition-all' : 'tab-inactive flex-1 pb-3 text-sm font-semibold transition-all';
      hideMessages();
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.remove('hidden');
      document.getElementById('success-msg').classList.add('hidden');
    }

    function showSuccess(msg) {
      const el = document.getElementById('success-msg');
      el.textContent = msg;
      el.classList.remove('hidden');
      document.getElementById('error-msg').classList.add('hidden');
    }

    function hideMessages() {
      document.getElementById('error-msg').classList.add('hidden');
      document.getElementById('success-msg').classList.add('hidden');
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.textContent = loading ? 'Por favor espera...' : (btnId === 'signin-btn' ? 'Iniciar Sesión' : 'Crear Cuenta');
    }

    async function handleSignIn(e) {
      e.preventDefault();
      hideMessages();
      setLoading('signin-btn', true);
      const email = document.getElementById('signin-email').value;
      const password = document.getElementById('signin-password').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      setLoading('signin-btn', false);
      if (error) return showError(error.message);
      window.location.href = 'app.html';
    }

    async function handleSignUp(e) {
      e.preventDefault();
      hideMessages();
      setLoading('signup-btn', true);
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const { error } = await sb.auth.signUp({
        email, password,
        options: { data: { full_name: name } }
      });
      setLoading('signup-btn', false);
      if (error) return showError(error.message);
      window.location.href = 'app.html';
    }

    async function signInWithGoogle() {
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/app.html' }
      });
      if (error) showError(error.message);
    }

    function showForgotPassword() {
      const email = document.getElementById('signin-email').value;
      if (!email) return showError('Ingresa tu correo electrónico primero.');
      sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/login.html'
      }).then(({ error }) => {
        if (error) return showError(error.message);
        showSuccess('¡Correo de recuperación enviado! Revisa tu bandeja de entrada.');
      });
    }
  </script>

  <!-- Cloudflare Web Analytics — replace token with value from CF Dashboard → Web Analytics -->
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js'
    data-cf-beacon='{"token": "2ab86622d1854c15aa2a925bddbc80d4"}'></script>
</body>
</html>
